# Tabnine PR Agent for GitHub
#
# This workflow runs an AI-powered code review on pull requests
# using Tabnine OpenCode.
#
# Copy this file to your repository at .github/workflows/tabnine-review.yml
# and copy prompts/github-review-v1.md to .github/prompts/github-review-v1.md.
# The standalone workflow requires both files.
#
# Required Secrets (set in Settings > Secrets and variables > Actions):
#   TABNINE_KEY          - Tabnine Personal Access Token. Store as a repository secret.
#
# Required Variables (set in Settings > Secrets and variables > Actions > Variables tab > "New repository variable"):
#   TABNINE_MODEL_ID     - Required model slug, either bare or prefixed with "tabnine/".
#
# Optional Variables:
#   TABNINE_HOST         - Tabnine host URL (default: https://console.tabnine.com). Set this for self-hosted / EMT installations.
#   TABNINE_CLEANUP      - Set to "true" to uninstall action-managed OpenCode files after each run (default: "false"). Recommended for self-hosted runners.
#   TABNINE_COMMENT_PREFIX - Prefix used to identify bot comments (default: '#### Tabnine PR Bot').
#   TABNINE_FETCH_DEPTH  - Clone depth for actions/checkout (default: "1", shallow). The built-in review uses the 'gh' API and does not need local git history.
#                          Set to "0" for full history if you provide a custom prompt that inspects local git history (e.g. git log, git blame).

# Skip a review by starting the head commit message with [skip-review].
#
name: "Tabnine PR Review Agent"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

# A new push to the same PR cancels the review that is still running for the previous push.
concurrency:
  group: tabnine-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check for [skip-review]
        id: skip
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A head commit whose message starts with [skip-review] opts out of review.
          MSG="$(gh api "/repos/$REPO/commits/$HEAD_SHA" --jq .commit.message 2>/dev/null || true)"
          LOWER="$(printf '%s' "$MSG" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            "[skip-review]"*)
              echo "::notice::Head commit message starts with [skip-review]; skipping Tabnine review."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout the repository
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # Clone depth. Default is 1 (shallow), which matches actions/checkout's native default and is sufficient
          # for the built-in review (it uses the 'gh' API, not local git history).
          # Set the repository variable TABNINE_FETCH_DEPTH to "0" for full history, or another value, if your
          # custom prompt_override inspects local git history (e.g. git log, git blame, git diff base..head).
          fetch-depth: ${{ vars.TABNINE_FETCH_DEPTH || 1 }}

      - name: Install Tabnine OpenCode
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        env:
          TABNINE_HOST: ${{ vars.TABNINE_HOST || 'https://console.tabnine.com' }}
        run: |
          set -euo pipefail

          # Resolve and run the platform bundle directly rather than the
          # install.sh one-liner: that helper reopens /dev/tty to prompt, which
          # fails on a runner with no controlling terminal.
          HOST="${TABNINE_HOST%/}"

          case "$(uname -s)" in
            Linux) OS=linux ;;
            Darwin) OS=darwin ;;
            *) echo "Error: unsupported OS $(uname -s)" >&2; exit 1 ;;
          esac

          # uname -m describes the process, not the machine: under Rosetta it
          # reports x86_64 on Apple Silicon.
          if [ "$OS" = darwin ] && [ "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" = 1 ]; then
            ARCH=arm64
          else
            case "$(uname -m)" in
              x86_64|amd64) ARCH=x64 ;;
              arm64|aarch64) ARCH=arm64 ;;
              *) echo "Error: unsupported architecture $(uname -m)" >&2; exit 1 ;;
            esac
          fi

          VERSION="$(curl -fsSL "$HOST/update/opencode/version" | tr -d '\r\n\t ')"
          case "$VERSION" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Error: invalid version from $HOST/update/opencode/version: $VERSION" >&2
              exit 1
              ;;
          esac

          BUNDLE="$(mktemp "${TMPDIR:-/tmp}/tabnine-opencode.XXXXXX")"
          trap 'rm -f "$BUNDLE"' EXIT
          curl -fsSL -o "$BUNDLE" \
            "$HOST/update/opencode/$VERSION/tabnine-opencode-$VERSION-$OS-$ARCH.run"
          sh "$BUNDLE" -- --no-login --force --no-modify-path

          # Verify installation succeeded
          if [ ! -x ~/.local/bin/tabnine ]; then
            echo "Error: Tabnine OpenCode installation failed"
            exit 1
          fi
          ~/.local/bin/tabnine --version

      - name: Configure git
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Tabnine CLI Agent"
          git config user.email "TabnineCLI@tabnine.com"

      - name: Collect existing review state
        id: state
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_PREFIX: ${{ vars.TABNINE_COMMENT_PREFIX || '#### Tabnine PR Bot' }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STATE_DIR: ${{ runner.temp }}/tabnine-review-state
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"

          BOT_LOGIN="$(gh api /user --jq .login 2>/dev/null || printf '%s' 'github-actions[bot]')"
          export BOT_LOGIN
          printf '%s\n' "$BOT_LOGIN" > "$STATE_DIR/bot_login.txt"
          gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | {id, user: .user.login, created_at, is_bot_review: ((.user.login == env.BOT_LOGIN) and (.body | startswith(env.COMMENT_PREFIX))), body}' \
            > "$STATE_DIR/issue_comments.jsonl"
          gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | {id, in_reply_to_id, user: .user.login, path, line, original_line, commit_id, original_commit_id, created_at, is_bot_review: ((.user.login == env.BOT_LOGIN) and (.body | startswith(env.COMMENT_PREFIX))), body}' \
            > "$STATE_DIR/review_comments.jsonl"
          gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].id' > "$STATE_DIR/issue_comment_ids.txt"

          LAST_SHA="$(jq -r 'select(.is_bot_review == true) | .body | select(([scan("tabnine-reviewed-sha:[0-9a-f]{40}")] | length) == 1) | capture("tabnine-reviewed-sha:(?<sha>[0-9a-f]{40})").sha' \
            "$STATE_DIR/issue_comments.jsonl" | tail -n1)"

          HINT=clean
          if [ -z "$LAST_SHA" ]; then
            REASON="no previous review of this PR found"
          elif [ "$LAST_SHA" = "$HEAD_SHA" ]; then
            REASON="the head commit was already reviewed (re-run), so review it again from scratch"
          elif ! STATUS="$(gh api "/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA" --jq .status)"; then
            REASON="GitHub could not compare the last reviewed commit with the head"
            echo "::warning::$REASON; using a clean review"
          elif [ "$STATUS" != "ahead" ]; then
            REASON="the last reviewed commit is no longer an ancestor of the head (force push or rebase)"
          else
            OWNER="${REPO%%/*}"
            NAME="${REPO#*/}"
            gh api graphql --paginate -F owner="$OWNER" -F name="$NAME" -F number="$PR_NUMBER" -f query='
              query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    commits(first: 100, after: $endCursor) {
                      nodes { commit { oid parents(first: 100) { nodes { oid } } } }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' \
              --jq '.data.repository.pullRequest.commits.nodes[] | [.commit.oid, [.commit.parents.nodes[].oid]] | @base64' \
              > "$STATE_DIR/pr_commits.txt"
            : > "$STATE_DIR/pr_commit_shas.txt"
            : > "$STATE_DIR/base_merge_shas.txt"
            while IFS= read -r RECORD; do
              [ -n "$RECORD" ] || continue
              COMMIT="$(printf '%s' "$RECORD" | base64 --decode)"
              SHA="$(printf '%s' "$COMMIT" | jq -r '.[0]')"
              BASE_MERGE=false
              if [ "$(printf '%s' "$COMMIT" | jq '.[1] | length')" -gt 1 ]; then
                while IFS= read -r PARENT_SHA; do
                  PARENT_STATUS="$(gh api "/repos/$REPO/compare/$PARENT_SHA...$BASE_SHA" --jq .status)"
                  if [ "$PARENT_STATUS" = "ahead" ] || [ "$PARENT_STATUS" = "identical" ]; then
                    BASE_MERGE=true
                    break
                  fi
                done < <(printf '%s' "$COMMIT" | jq -r '.[1][]')
              fi
              if [ "$BASE_MERGE" = true ]; then
                printf '%s\n' "$SHA" >> "$STATE_DIR/base_merge_shas.txt"
              else
                printf '%s\n' "$SHA" >> "$STATE_DIR/pr_commit_shas.txt"
              fi
            done < "$STATE_DIR/pr_commits.txt"

            gh api --paginate "/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA?per_page=100" \
              --jq '.commits[].sha' \
              > "$STATE_DIR/all_since_last_review_shas.txt"
            grep -Fxf "$STATE_DIR/pr_commit_shas.txt" "$STATE_DIR/all_since_last_review_shas.txt" \
              > "$STATE_DIR/relevant_commit_shas.txt" || true

            BASE_MERGED_SINCE_REVIEW=false
            while IFS= read -r MERGE_SHA; do
              [ -n "$MERGE_SHA" ] || continue
              if grep -qxF "$MERGE_SHA" "$STATE_DIR/all_since_last_review_shas.txt"; then
                BASE_MERGED_SINCE_REVIEW=true
                break
              fi
            done < "$STATE_DIR/base_merge_shas.txt"

            : > "$STATE_DIR/commits_since_last_review.jsonl"
            : > "$STATE_DIR/files_since_last_review.raw.jsonl"
            : > "$STATE_DIR/changes_since_last_review.diff"
            while IFS= read -r SHA; do
              [ -n "$SHA" ] || continue
              gh api "/repos/$REPO/commits/$SHA" \
                --jq '{sha, author: .commit.author.name, message: .commit.message}' \
                >> "$STATE_DIR/commits_since_last_review.jsonl"
              gh api --paginate "/repos/$REPO/commits/$SHA?per_page=100" \
                --jq '.files[]? | {filename, status, additions, deletions}' \
                >> "$STATE_DIR/files_since_last_review.raw.jsonl"
              gh api "/repos/$REPO/commits/$SHA" -H 'Accept: application/vnd.github.v3.diff' \
                >> "$STATE_DIR/changes_since_last_review.diff"
              printf '\n' >> "$STATE_DIR/changes_since_last_review.diff"
            done < "$STATE_DIR/relevant_commit_shas.txt"

            jq -s 'sort_by(.filename) | group_by(.filename)[] | {filename: .[0].filename, status: .[-1].status, additions: (map(.additions) | add), deletions: (map(.deletions) | add)}' \
              "$STATE_DIR/files_since_last_review.raw.jsonl" \
              > "$STATE_DIR/files_since_last_review.jsonl"
            if [ "$BASE_MERGED_SINCE_REVIEW" = true ]; then
              HINT=clean
              REASON="the base branch was merged since the last review; using a clean review to cover conflict resolutions"
            else
              HINT=classify
              REASON="$(wc -l < "$STATE_DIR/commits_since_last_review.jsonl" | tr -d ' ') PR commit(s) pushed since the last review"
            fi
          fi

          echo "Last reviewed commit: ${LAST_SHA:-none}"
          echo "Review mode hint: $HINT ($REASON)"
          {
            echo "state_dir=$STATE_DIR"
            echo "last_sha=$LAST_SHA"
            echo "mode_hint=$HINT"
            echo "mode_reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Code Review
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        continue-on-error: true
        env:
          TABNINE_TOKEN: ${{ secrets.TABNINE_KEY }}
          TABNINE_HOST: ${{ vars.TABNINE_HOST || 'https://console.tabnine.com' }}
          TABNINE_MODEL_ID: ${{ vars.TABNINE_MODEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_DATA_HOME: ${{ runner.temp }}/tabnine-pr-agent-opencode-data
          AGENT_OUTPUT_FILE: ${{ runner.temp }}/tabnine-agent-output.txt
          COMMENT_PREFIX: ${{ vars.TABNINE_COMMENT_PREFIX || '#### Tabnine PR Bot' }}
          STATE_DIR: ${{ steps.state.outputs.state_dir }}
          LAST_REVIEWED_SHA: ${{ steps.state.outputs.last_sha }}
          REVIEW_MODE_HINT: ${{ steps.state.outputs.mode_hint }}
          REVIEW_MODE_REASON: ${{ steps.state.outputs.mode_reason }}
          RENDERED_PROMPT: ${{ runner.temp }}/tabnine-github-review-prompt.md
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ -z "$TABNINE_TOKEN" ]; then
            echo "Error: TABNINE_KEY is required"
            exit 1
          fi

          case "$TABNINE_MODEL_ID" in
            tabnine/?*) MODEL="$TABNINE_MODEL_ID" ;;
            */*) echo "Error: TABNINE_MODEL_ID must be a Tabnine model (bare slug or tabnine/<slug>)" >&2; exit 1 ;;
            ?*) MODEL="tabnine/$TABNINE_MODEL_ID" ;;
            *) echo "Error: TABNINE_MODEL_ID is required" >&2; exit 1 ;;
          esac

          render_value() {
            placeholder=$1
            value=$2
            newline=$(printf '\nX')
            newline=${newline%X}
            case "$value" in
              *"$newline"*) echo "Error: $placeholder contains a newline" >&2; exit 1 ;;
              *__TABNINE_*) echo "Error: $placeholder contains a reserved placeholder" >&2; exit 1 ;;
            esac
            escaped=$(printf '%s' "$value" | sed 's/[\\&|]/\\&/g')
            next_prompt="${RENDERED_PROMPT}.next"
            sed "s|$placeholder|$escaped|g" "$RENDERED_PROMPT" > "$next_prompt"
            mv "$next_prompt" "$RENDERED_PROMPT"
          }

          PROMPT_TEMPLATE="$GITHUB_WORKSPACE/.github/prompts/github-review-v1.md"
          cp "$PROMPT_TEMPLATE" "$RENDERED_PROMPT"
          render_value __TABNINE_REPOSITORY__ "$REPOSITORY"
          render_value __TABNINE_PR_NUMBER__ "$PR_NUMBER"
          render_value __TABNINE_HEAD_SHA__ "$HEAD_SHA"
          render_value __TABNINE_BASE_SHA__ "$BASE_SHA"
          render_value __TABNINE_STATE_DIR__ "$STATE_DIR"
          render_value __TABNINE_LAST_REVIEWED_SHA__ "${LAST_REVIEWED_SHA:-none}"
          render_value __TABNINE_REVIEW_MODE_HINT__ "$REVIEW_MODE_HINT"
          render_value __TABNINE_REVIEW_MODE_REASON__ "$REVIEW_MODE_REASON"
          render_value __TABNINE_COMMENT_PREFIX__ "$COMMENT_PREFIX"

          ~/.local/bin/tabnine run --model "$MODEL" --auto "$(cat "$RENDERED_PROMPT")" | tee "$AGENT_OUTPUT_FILE"

      - name: Ensure summary comment posted
        # !cancelled(): a run cancelled by a newer push must not post a half-finished summary.
        if: ${{ !cancelled() && steps.skip.outputs.skip != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_PREFIX: ${{ vars.TABNINE_COMMENT_PREFIX || '#### Tabnine PR Bot' }}
          AGENT_OUTPUT_FILE: ${{ runner.temp }}/tabnine-agent-output.txt
          STATE_DIR: ${{ runner.temp }}/tabnine-review-state
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A summary was posted this run if a bot comment exists that was not in the
          # pre-run snapshot. Inline review comments live on a different endpoint
          # (pulls/comments), so they never satisfy this check.
          mkdir -p "$STATE_DIR" && touch "$STATE_DIR/issue_comment_ids.txt"
          REVIEW_MARKER="<!-- tabnine-reviewed-sha:$HEAD_SHA -->"
          BOT_LOGIN="$(cat "$STATE_DIR/bot_login.txt" 2>/dev/null || true)"
          export REVIEW_MARKER BOT_LOGIN
          existing=$({ gh api --paginate "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select((.user.login == env.BOT_LOGIN) and (.body | startswith(env.COMMENT_PREFIX)) and (.body | contains(env.REVIEW_MARKER)) and (([.body | scan("tabnine-reviewed-sha:[0-9a-f]{40}")] | length) == 1)) | .id' 2>/dev/null \
            | grep -vxFf "$STATE_DIR/issue_comment_ids.txt" || true; } | wc -l | tr -d ' ')

          if [ "${existing:-0}" -gt 0 ]; then
            echo "Summary comment already posted by the agent; nothing to do."
            exit 0
          fi

          if [ ! -s "$AGENT_OUTPUT_FILE" ]; then
            echo "::warning::Tabnine agent posted no summary comment and no agent output was captured; skipping fallback."
            exit 0
          fi

          clean=$(sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$AGENT_OUTPUT_FILE")
          summary=$(printf '%s\n' "$clean" | awk '
            /<<<TABNINE_SUMMARY_START>>>/ { cap=1; buf=""; next }
            /<<<TABNINE_SUMMARY_END>>>/   { if (cap) { last=buf; cap=0 } next }
            cap { buf = buf $0 "\n" }
            END { printf "%s", last }
          ')

          if [ -z "${summary//[$' \t\r\n']/}" ]; then
            summary=$(printf '%s\n' "$clean" | awk -v p="$COMMENT_PREFIX" '
              index($0, p) == 1 { start = NR }
              { lines[NR] = $0 }
              END {
                if (!start) exit
                end = NR
                for (i = start; i <= NR; i++) if (lines[i] ~ /<\/details>/) { end = i; break }
                for (i = start; i <= end; i++) print lines[i]
              }
            ')
          fi

          if [ -z "${summary//[$' \t\r\n']/}" ]; then
            echo "::warning::Tabnine agent did not post a summary comment and none could be recovered from its output."
            exit 0
          fi

          if [ "$(printf '%s\n' "$summary" | sed -n '1p')" != "$COMMENT_PREFIX" ]; then
            echo "::warning::Recovered output was not a Tabnine summary; skipping fallback."
            exit 0
          fi

          summary=$(printf '%s\n' "$summary" \
            | sed -E 's/<!--[[:space:]]*tabnine-reviewed-sha:[^>]*-->//g; s/tabnine-reviewed-sha:[0-9a-f]{40}//g' \
            | awk -v m="<!-- tabnine-reviewed-sha:$HEAD_SHA -->" 'NR==1 { print; print ""; print m; next } { print }')

          echo "Tabnine agent did not post its summary; posting the recovered summary as a fallback."
          gh api --method POST "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$summary"

      - name: Remove superseded clean-review comments
        if: ${{ !cancelled() && steps.skip.outputs.skip != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_PREFIX: ${{ vars.TABNINE_COMMENT_PREFIX || '#### Tabnine PR Bot' }}
          STATE_DIR: ${{ runner.temp }}/tabnine-review-state
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REVIEW_MARKER="<!-- tabnine-reviewed-sha:$HEAD_SHA -->"
          BOT_LOGIN="$(cat "$STATE_DIR/bot_login.txt" 2>/dev/null || true)"
          export REVIEW_MARKER BOT_LOGIN
          summary_body="$(gh api --paginate "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select((.user.login == env.BOT_LOGIN) and (.body | startswith(env.COMMENT_PREFIX)) and (.body | contains(env.REVIEW_MARKER)) and (([.body | scan("tabnine-reviewed-sha:[0-9a-f]{40}")] | length) == 1)) | [.id, .body] | @base64' \
            | while IFS= read -r RECORD; do
                ID="$(printf '%s' "$RECORD" | base64 --decode | jq -r '.[0]')"
                if ! grep -qxF "$ID" "$STATE_DIR/issue_comment_ids.txt"; then
                  printf '%s' "$RECORD" | base64 --decode | jq -r '.[1]'
                fi
              done)"

          mode="$(cat "$STATE_DIR/review_mode" 2>/dev/null || true)"
          if [ "$mode" != "clean" ]; then
            echo "Review mode was not clean; preserving previous comments."
            exit 0
          fi
          if [ -z "$summary_body" ]; then
            echo "::error::A clean review did not post a new valid summary for $HEAD_SHA; preserving previous comments."
            exit 1
          fi

          jq -r 'select(.is_bot_review == true) | .id' "$STATE_DIR/issue_comments.jsonl" | while IFS= read -r COMMENT_ID; do
            gh api --method DELETE "/repos/$REPOSITORY/issues/comments/$COMMENT_ID" || \
              echo "::warning::Could not delete old summary comment $COMMENT_ID"
          done
          jq -sr 'map(select(.is_bot_review == true)) | sort_by(.in_reply_to_id == null)[] | .id' "$STATE_DIR/review_comments.jsonl" | while IFS= read -r COMMENT_ID; do
            gh api --method DELETE "/repos/$REPOSITORY/pulls/comments/$COMMENT_ID" || \
              echo "::warning::Could not delete old review comment $COMMENT_ID"
          done
          echo "Removed superseded bot comments after posting the clean-review summary."

      - name: Cleanup temporary OpenCode data
        if: always()
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/tabnine-pr-agent-opencode-data
          AGENT_OUTPUT_FILE: ${{ runner.temp }}/tabnine-agent-output.txt
          RENDERED_PROMPT: ${{ runner.temp }}/tabnine-github-review-prompt.md
        run: |
          rm -rf "$XDG_DATA_HOME" "$RUNNER_TEMP/tabnine-review-state"
          rm -f "$AGENT_OUTPUT_FILE" "$RENDERED_PROMPT" "${RENDERED_PROMPT}.next"

      - name: Cleanup Tabnine OpenCode
        if: always() && steps.skip.outputs.skip != 'true' && vars.TABNINE_CLEANUP == 'true'
        shell: bash
        run: |
          if [ -f ~/.tabnine/opencode/uninstall-tabnine.sh ]; then
            bash ~/.tabnine/opencode/uninstall-tabnine.sh --yes
          else
            echo "::warning::Tabnine OpenCode cleanup was requested, but the uninstaller was not found."
          fi
