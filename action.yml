# Tabnine PR Agent for GitHub
#
# This composite action runs a Tabnine OpenCode task on pull requests.
# By default it performs an AI-powered code review, but the prompt can be
# overridden to run any custom task (e.g., enforcing conventions, generating
# summaries, or checking documentation).
#
# Required Inputs:
#   TABNINE_KEY          - Tabnine Personal Access Token. Store as a repository secret.
#   model_id             - Tabnine model slug, either bare or prefixed with "tabnine/".
#   github_token         - GitHub token for authentication (typically ${{ secrets.GITHUB_TOKEN }}).
#   repository           - Repository in owner/repo format.
#   pull_request_number  - Pull request number.
#   head_sha             - PR head commit SHA.
#   base_sha             - PR base commit SHA.
#
# Optional Inputs:
#   tabnine_host         - Tabnine host URL (default: https://console.tabnine.com)
#   prompt_override      - Custom prompt to replace the default code review prompt. When set, the agent runs your prompt instead.
#   step_name            - Display name for the agent step (default: 'Tabnine Agent').
#   comment_prefix       - Prefix used to identify bot comments (default: '#### Tabnine PR Bot'). Each action invocation should use a unique prefix to avoid interfering with other invocations.
#   cleanup              - Set to "true" to uninstall action-managed OpenCode files after each run (default: "false"). Recommended for self-hosted runners.

# Skip a review by starting the head commit message with [skip-review].
# To cancel a running review when a new commit is pushed, add a 'concurrency' block with
# cancel-in-progress: true to the calling workflow (a composite action cannot set it).

name: 'Tabnine PR Agent'
description: "Run Tabnine's AI agent on your pull requests: inline feedback, cross-repo impact analysis, and customizable prompts"

inputs:
  TABNINE_KEY:
    required: true
    description: 'Tabnine Personal Access Token'
  github_token:
    required: true
    description: 'GitHub token for authentication'
  tabnine_host:
    required: false
    description: 'Tabnine host URL'
    default: 'https://console.tabnine.com'
  model_id:
    required: true
    description: 'Tabnine model slug, either bare (for example claude-sonnet-4-5) or prefixed with tabnine/.'
  cleanup:
    required: false
    description: 'Set to "true" to uninstall the action-managed Tabnine OpenCode files after each run. Recommended for self-hosted runners.'
    default: 'false'
  repository:
    required: true
    description: 'Repository in owner/repo format'
  pull_request_number:
    required: true
    description: 'Pull request number'
  head_sha:
    required: true
    description: 'PR head commit SHA'
  base_sha:
    required: true
    description: 'PR base commit SHA'
  prompt_override:
    required: false
    description: 'Custom prompt to replace the default code review prompt. When provided, this prompt is passed to the Tabnine CLI agent instead of the built-in code review prompt.'
    default: ''
  step_name:
    required: false
    description: 'Display name for the agent step.'
    default: 'Tabnine Agent'
  comment_prefix:
    required: false
    description: 'Prefix used to identify bot comments. Use a unique value per action invocation to avoid cross-cleanup.'
    default: '#### Tabnine PR Bot'

runs:
  using: 'composite'
  steps:
    - name: Check for [skip-review]
      id: skip
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ inputs.repository }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        set -euo pipefail
        # A head commit whose message starts with [skip-review] opts out of review.
        MSG="$(gh api "/repos/$REPO/commits/$HEAD_SHA" --jq .commit.message 2>/dev/null || true)"
        LOWER="$(printf '%s' "$MSG" | tr '[:upper:]' '[:lower:]')"
        case "$LOWER" in
          "[skip-review]"*)
            echo "::notice::Head commit message starts with [skip-review]; skipping Tabnine review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "skip=false" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Install Tabnine OpenCode
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      env:
        TABNINE_HOST: ${{ inputs.tabnine_host }}
      run: |
        set -euo pipefail

        # Resolve and run the platform bundle directly rather than the
        # install.sh one-liner: that helper reopens /dev/tty to prompt, which
        # fails on a runner with no controlling terminal. Authentication is
        # supplied only to the run step.
        HOST="${TABNINE_HOST%/}"

        case "$(uname -s)" in
          Linux) OS=linux ;;
          Darwin) OS=darwin ;;
          *) echo "Error: unsupported OS $(uname -s)" >&2; exit 1 ;;
        esac

        # uname -m describes the process, not the machine: under Rosetta it
        # reports x86_64 on Apple Silicon.
        if [ "$OS" = darwin ] && [ "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" = 1 ]; then
          ARCH=arm64
        else
          case "$(uname -m)" in
            x86_64|amd64) ARCH=x64 ;;
            arm64|aarch64) ARCH=arm64 ;;
            *) echo "Error: unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
        fi

        VERSION="$(curl -fsSL "$HOST/update/opencode/version" | tr -d '\r\n\t ')"
        case "$VERSION" in
          ""|*[!A-Za-z0-9._-]*)
            echo "Error: invalid version from $HOST/update/opencode/version: $VERSION" >&2
            exit 1
            ;;
        esac

        BUNDLE="$(mktemp "${TMPDIR:-/tmp}/tabnine-opencode.XXXXXX")"
        trap 'rm -f "$BUNDLE"' EXIT
        curl -fsSL -o "$BUNDLE" \
          "$HOST/update/opencode/$VERSION/tabnine-opencode-$VERSION-$OS-$ARCH.run"
        sh "$BUNDLE" -- --no-login --force --no-modify-path

        # Verify installation succeeded
        if [ ! -x ~/.local/bin/tabnine ]; then
          echo "Error: Tabnine OpenCode installation failed"
          exit 1
        fi
        ~/.local/bin/tabnine --version

    - name: Configure git
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      run: |
        git config user.name "Tabnine CLI Agent"
        git config user.email "TabnineCLI@tabnine.com"

    - name: Clean Up Previous Bot Comments
      # Custom prompts have no review-state handling, so they keep the delete-and-repost behavior.
      if: steps.skip.outputs.skip != 'true' && inputs.prompt_override != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        COMMENT_PREFIX: ${{ inputs.comment_prefix }}
        REPO: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
      run: |
        echo "Cleaning up previous bot summary comments (prefix: $COMMENT_PREFIX)..."

        # Get all issue comments on the PR matching the configured prefix
        COMMENTS=$(gh api "/repos/$REPO/issues/$PR_NUMBER/comments" --jq '[.[] | select(.body | startswith(env.COMMENT_PREFIX)) | .id] | .[]')

        # Delete all bot summary comments to prevent duplicates
        # Note: DELETE endpoint is /repos/{owner}/{repo}/issues/comments/{comment_id} (no issue number)
        for COMMENT_ID in $COMMENTS; do
          echo "Deleting bot summary comment: $COMMENT_ID"
          gh api --method DELETE "/repos/$REPO/issues/comments/$COMMENT_ID" || true
        done

        # Get all pull-request review (inline) comments matching the configured prefix
        PR_COMMENTS=$(gh api "/repos/$REPO/pulls/$PR_NUMBER/comments" --jq '[.[] | select(.body | startswith(env.COMMENT_PREFIX)) | .id] | .[]')

        # Delete all bot inline review comments to prevent duplicates
        for COMMENT_ID in $PR_COMMENTS; do
          echo "Deleting bot inline review comment: $COMMENT_ID"
          gh api --method DELETE "/repos/$REPO/pulls/comments/$COMMENT_ID" || true
        done

        echo "Cleanup complete."

    - name: Collect existing review state
      id: state
      if: steps.skip.outputs.skip != 'true' && inputs.prompt_override == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        COMMENT_PREFIX: ${{ inputs.comment_prefix }}
        REPO: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        STATE_DIR: ${{ runner.temp }}/tabnine-review-state
      run: |
        set -euo pipefail
        rm -rf "$STATE_DIR"
        mkdir -p "$STATE_DIR"

        # Existing comments are passed to the agent as files instead of being deleted:
        # the agent decides whether to re-review from scratch or only check the fixes.
        gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq '.[] | {id, user: .user.login, created_at, is_bot_review: (.body | startswith(env.COMMENT_PREFIX)), body}' \
          > "$STATE_DIR/issue_comments.jsonl"
        gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/comments" \
          --jq '.[] | {id, in_reply_to_id, user: .user.login, path, line, original_line, commit_id, original_commit_id, created_at, is_bot_review: (.body | startswith(env.COMMENT_PREFIX)), body}' \
          > "$STATE_DIR/review_comments.jsonl"
        # Ids present before the run, so the fallback step can tell whether the agent posted a summary.
        gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].id' > "$STATE_DIR/issue_comment_ids.txt"

        # Every bot summary carries <!-- tabnine-reviewed-sha:<40 hex> -->; the last one wins.
        LAST_SHA="$(grep '"is_bot_review":true' "$STATE_DIR/issue_comments.jsonl" \
          | grep -oE 'tabnine-reviewed-sha:[0-9a-f]{40}' | tail -n1 | cut -d: -f2 || true)"

        HINT=clean
        if [ -z "$LAST_SHA" ]; then
          REASON="no previous review of this PR found"
        elif [ "$LAST_SHA" = "$HEAD_SHA" ]; then
          REASON="the head commit was already reviewed (re-run), so review it again from scratch"
        elif STATUS="$(gh api "/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA" --jq .status 2>/dev/null)" && [ "$STATUS" = "ahead" ]; then
          gh api "/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA" \
            --jq '.commits[] | {sha, author: .commit.author.name, message: .commit.message}' \
            > "$STATE_DIR/commits_since_last_review.jsonl"
          gh api "/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA" \
            --jq '.files[]? | {filename, status, additions, deletions}' \
            > "$STATE_DIR/files_since_last_review.jsonl"
          HINT=classify
          REASON="$(wc -l < "$STATE_DIR/commits_since_last_review.jsonl" | tr -d ' ') commit(s) pushed since the last review"
        else
          REASON="the last reviewed commit is no longer an ancestor of the head (force push or rebase)"
        fi

        echo "Last reviewed commit: ${LAST_SHA:-none}"
        echo "Review mode hint: $HINT ($REASON)"
        {
          echo "state_dir=$STATE_DIR"
          echo "last_sha=$LAST_SHA"
          echo "mode_hint=$HINT"
          echo "mode_reason=$REASON"
        } >> "$GITHUB_OUTPUT"

    - name: ${{ inputs.step_name }}
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      env:
        TABNINE_TOKEN: ${{ inputs.TABNINE_KEY }}
        TABNINE_HOST: ${{ inputs.tabnine_host }}
        MODEL_ID: ${{ inputs.model_id }}
        GH_TOKEN: ${{ inputs.github_token }}
        PROMPT_OVERRIDE: ${{ inputs.prompt_override }}
        STATE_DIR: ${{ steps.state.outputs.state_dir }}
        LAST_REVIEWED_SHA: ${{ steps.state.outputs.last_sha }}
        REVIEW_MODE_HINT: ${{ steps.state.outputs.mode_hint }}
        REVIEW_MODE_REASON: ${{ steps.state.outputs.mode_reason }}
        XDG_DATA_HOME: ${{ runner.temp }}/tabnine-pr-agent-opencode-data
        AGENT_OUTPUT_FILE: ${{ runner.temp }}/tabnine-agent-output.txt
        PROMPT_TEMPLATE: ${{ github.action_path }}/prompts/github-review-v1.md
        RENDERED_PROMPT: ${{ runner.temp }}/tabnine-github-review-prompt.md
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
        COMMENT_PREFIX: ${{ inputs.comment_prefix }}
      run: |
        set -euo pipefail

        if [ -z "$TABNINE_TOKEN" ]; then
          echo "Error: TABNINE_KEY is required"
          exit 1
        fi

        case "$MODEL_ID" in
          tabnine/?*) MODEL="$MODEL_ID" ;;
          */*) echo "Error: model_id must be a Tabnine model (bare slug or tabnine/<slug>)" >&2; exit 1 ;;
          ?*) MODEL="tabnine/$MODEL_ID" ;;
          *) echo "Error: model_id is required" >&2; exit 1 ;;
        esac

        if [ -n "$PROMPT_OVERRIDE" ]; then
          ~/.local/bin/tabnine run --model "$MODEL" --auto "$PROMPT_OVERRIDE"
          exit 0
        fi
      
        render_value() {
          placeholder=$1
          value=$2
          newline=$(printf '\nX')
          newline=${newline%X}
          case "$value" in
            *"$newline"*) echo "Error: $placeholder contains a newline" >&2; exit 1 ;;
            *__TABNINE_*) echo "Error: $placeholder contains a reserved placeholder" >&2; exit 1 ;;
          esac
          escaped=$(printf '%s' "$value" | sed 's/[\\&|]/\\&/g')
          next_prompt="${RENDERED_PROMPT}.next"
          sed "s|$placeholder|$escaped|g" "$RENDERED_PROMPT" > "$next_prompt"
          mv "$next_prompt" "$RENDERED_PROMPT"
        }

        cp "$PROMPT_TEMPLATE" "$RENDERED_PROMPT"
        render_value __TABNINE_REPOSITORY__ "$REPOSITORY"
        render_value __TABNINE_PR_NUMBER__ "$PR_NUMBER"
        render_value __TABNINE_HEAD_SHA__ "$HEAD_SHA"
        render_value __TABNINE_BASE_SHA__ "$BASE_SHA"
        render_value __TABNINE_STATE_DIR__ "$STATE_DIR"
        render_value __TABNINE_LAST_REVIEWED_SHA__ "${LAST_REVIEWED_SHA:-none}"
        render_value __TABNINE_REVIEW_MODE_HINT__ "$REVIEW_MODE_HINT"
        render_value __TABNINE_REVIEW_MODE_REASON__ "$REVIEW_MODE_REASON"
        render_value __TABNINE_COMMENT_PREFIX__ "$COMMENT_PREFIX"

        ~/.local/bin/tabnine run --model "$MODEL" --auto "$(cat "$RENDERED_PROMPT")" | tee "$AGENT_OUTPUT_FILE"

    - name: Ensure summary comment posted
      # The agent is instructed (Phase D) to POST its summary by running 'gh api'.
      # When the underlying model emits the summary as plain text instead of
      # executing that command, nothing reaches the PR and the agent step still
      # exits 0 -- a silent no-review. This step is a deterministic safety net:
      # if no summary comment exists after the agent run, it recovers the summary
      # from the captured agent output and posts it. It is idempotent -- when the
      # agent posted correctly it finds the existing comment and does nothing.
      # Scoped to the built-in review (prompt_override has no summary contract).
      # !cancelled(): a run cancelled by a newer push must not post a half-finished summary.
      if: ${{ !cancelled() && steps.skip.outputs.skip != 'true' && inputs.prompt_override == '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        COMMENT_PREFIX: ${{ inputs.comment_prefix }}
        AGENT_OUTPUT_FILE: ${{ runner.temp }}/tabnine-agent-output.txt
        STATE_DIR: ${{ runner.temp }}/tabnine-review-state
        HEAD_SHA: ${{ inputs.head_sha }}
        REPO: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
      run: |
        # A summary was posted this run if a bot comment exists that was not in the
        # pre-run snapshot. Inline review comments live on a different endpoint
        # (pulls/comments), so they never satisfy this check.
        mkdir -p "$STATE_DIR" && touch "$STATE_DIR/issue_comment_ids.txt"
        existing=$({ gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq '.[] | select(.body | startswith(env.COMMENT_PREFIX)) | .id' 2>/dev/null \
          | grep -vxFf "$STATE_DIR/issue_comment_ids.txt" || true; } | wc -l | tr -d ' ')

        if [ "${existing:-0}" -gt 0 ]; then
          echo "Summary comment already posted by the agent; nothing to do."
          exit 0
        fi

        if [ ! -s "$AGENT_OUTPUT_FILE" ]; then
          echo "::warning::Tabnine agent posted no summary comment and no agent output was captured; skipping fallback."
          exit 0
        fi

        # Strip ANSI escape sequences the CLI emits for its TUI, then recover the
        # summary. Preferred: the explicit <<<TABNINE_SUMMARY_*>>> markers the
        # agent is told to print. Fallback: from the last line that begins with
        # the comment prefix through the first '</details>' (the metadata block
        # closes the summary), or to EOF. The Phase D summary is always the last
        # prefixed block, since inline comments are posted earlier.
        clean=$(sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$AGENT_OUTPUT_FILE")

        summary=$(printf '%s\n' "$clean" | awk '
          /<<<TABNINE_SUMMARY_START>>>/ { cap=1; buf=""; next }
          /<<<TABNINE_SUMMARY_END>>>/   { if (cap) { printf "%s", buf; cap=0 } next }
          cap { buf = buf $0 "\n" }
        ')

        if [ -z "${summary//[$' \t\r\n']/}" ]; then
          summary=$(printf '%s\n' "$clean" | awk -v p="$COMMENT_PREFIX" '
            index($0, p) == 1 { start = NR }
            { lines[NR] = $0 }
            END {
              if (!start) exit
              end = NR
              for (i = start; i <= NR; i++) if (lines[i] ~ /<\/details>/) { end = i; break }
              for (i = start; i <= end; i++) print lines[i]
            }
          ')
        fi

        if [ -z "${summary//[$' \t\r\n']/}" ]; then
          echo "::warning::Tabnine agent did not post a summary comment and none could be recovered from its output."
          exit 0
        fi

        # The summary must carry the reviewed-commit marker used by the next run.
        if ! printf '%s' "$summary" | grep -q 'tabnine-reviewed-sha:'; then
          summary=$(printf '%s\n' "$summary" | awk -v m="<!-- tabnine-reviewed-sha:$HEAD_SHA -->" 'NR==1 { print; print ""; print m; next } { print }')
        fi

        echo "Tabnine agent did not post its summary; posting the recovered summary as a fallback."
        gh api --method POST "/repos/$REPO/issues/$PR_NUMBER/comments" -f body="$summary"

    - name: Cleanup temporary OpenCode data
      if: always()
      shell: bash
      env:
        XDG_DATA_HOME: ${{ runner.temp }}/tabnine-pr-agent-opencode-data
        AGENT_OUTPUT_FILE: ${{ runner.temp }}/tabnine-agent-output.txt
        RENDERED_PROMPT: ${{ runner.temp }}/tabnine-github-review-prompt.md
      run: |
        rm -rf "$XDG_DATA_HOME" "$RUNNER_TEMP/tabnine-review-state"
        rm -f "$AGENT_OUTPUT_FILE" "$RENDERED_PROMPT" "${RENDERED_PROMPT}.next"

    - name: Cleanup Tabnine OpenCode
      if: always() && steps.skip.outputs.skip != 'true' && inputs.cleanup == 'true'
      shell: bash
      run: |
        if [ -f ~/.tabnine/opencode/uninstall-tabnine.sh ]; then
          bash ~/.tabnine/opencode/uninstall-tabnine.sh --yes
        else
          echo "::warning::Tabnine OpenCode cleanup was requested, but the uninstaller was not found."
        fi


branding:
  icon: 'terminal'
  color: 'red'
